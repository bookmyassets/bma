name: Deploy Next.js

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Prepare standalone output
        run: |
          mkdir -p .next/standalone/.next

          rm -rf .next/standalone/.next/static
          cp -r .next/static .next/standalone/.next/static

          rm -rf .next/standalone/public
          mkdir -p .next/standalone/public
          cp -r public/. .next/standalone/public/

          rm -rf .next/standalone/.next/cache

      - name: Archive build output
        run: |
          tar \
            --exclude='.next/standalone/.next/cache' \
            -czf app.tar.gz \
            .next/standalone \
            package.json

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "app.tar.gz"
          target: "/var/www/rentalsindholera"
          overwrite: true

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          TELECRM_API_KEY: ${{ secrets.TELECRM_API_KEY }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: TELECRM_API_KEY
          script: |
            set -e

            echo "Loading NVM"

            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            else
              echo "NVM not found at $NVM_DIR"
              exit 1
            fi

            echo "Checking runtime"

            node -v
            npm -v
            pm2 -v

            echo "Opening project directory"

            cd /var/www/rentalsindholera

            echo "Extracting build"

            tar -xzf app.tar.gz

            echo "Removing unnecessary Next.js cache"

            rm -rf .next/standalone/.next/cache

            echo "Checking standalone server"

            if [ ! -f ".next/standalone/server.js" ]; then
              echo "server.js not found"
              exit 1
            fi

            echo "Restarting application"

            if pm2 describe rentalsindholera > /dev/null 2>&1; then

              TELECRM_API_KEY="$TELECRM_API_KEY" \
              HOSTNAME=127.0.0.1 \
              PORT=3000 \
              pm2 restart rentalsindholera --update-env

            else

              TELECRM_API_KEY="$TELECRM_API_KEY" \
              HOSTNAME=127.0.0.1 \
              PORT=3000 \
              pm2 start .next/standalone/server.js \
              --name rentalsindholera

            fi

            echo "Saving PM2 process"

            pm2 save

            echo "PM2 status"

            pm2 list

            echo "Testing Next.js directly"

            sleep 3

            curl -I http://127.0.0.1:3000 || true

            echo "Testing live website"

            curl -I https://www.rentalsindholera.com || true